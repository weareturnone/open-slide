<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./assets/studio-brand/favicon.svg" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="./assets/studio-brand/favicon-dark.svg" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="./assets/studio-brand/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F9FAF8" />
    <title>open-slide</title>
    <style>
      html {
        background-color: #F9FAF8;
      }
      html.dark {
        background-color: #1D1D19;
      }
    </style>
    <script>
      // Apply the stored theme before first paint; next-themes only runs
      // after the bundle loads, which flashes white for dark-mode users.
      let stored = null;
      try {
        stored = localStorage.getItem('theme');
      } catch (_) {}
      const dark =
        stored === 'dark' ||
        (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.classList.toggle('dark', dark);
      document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      document.querySelector('meta[name="theme-color"]').content = dark ? '#1D1D19' : '#F9FAF8';
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
